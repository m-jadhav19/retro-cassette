<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroCassette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='15' width='90' height='65' rx='6' fill='%231e293b' stroke='%23334155' stroke-width='2'/%3E%3Cpath d='M 10,75 L 15,60 L 85,60 L 90,75 Z' fill='%230f172a' opacity='0.5'/%3E%3Crect x='10' y='20' width='80' height='38' rx='4' fill='%23f97316'/%3E%3Crect x='25' y='26' width='50' height='26' rx='3' fill='%231e293b'/%3E%3Ccircle cx='38' cy='39' r='8' fill='%23f1f5f9'/%3E%3Ccircle cx='62' cy='39' r='8' fill='%23f1f5f9'/%3E%3C/svg%3E"
    />

    <style>
      /* Custom Scrollbar for the crate */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-vinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-cd {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-reel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes ambient-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes lcd-flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.85; }
        94% { opacity: 1; }
      }
      @keyframes bg-fade-in {
        from { opacity: 0; transform: scale(1.02); }
        to { opacity: 1; transform: scale(1); }
      }

      .animate-spin-slow { animation: spin 2s linear infinite; }
      .animate-spin-vinyl { animation: spin-vinyl 1.8s linear infinite; transform-origin: center; }
      .animate-spin-cd { animation: spin-cd 1.4s linear infinite; transform-origin: center; }
      .animate-spin-reel { animation: spin-reel 3.5s linear infinite reverse; transform-origin: center; }
      .animate-spin-reel-fast { animation: spin-reel 0.55s linear infinite reverse; transform-origin: center; }
      @keyframes loading-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes loading-dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }
      }
      .animate-loading-pulse { animation: loading-pulse 1.2s ease-in-out infinite; }
      .animate-loading-spin { animation: spin 0.8s linear infinite; }
      .animate-bg-enter { animation: bg-fade-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      @media (prefers-reduced-motion: reduce) {
        .animate-spin-slow,
        .animate-spin-vinyl,
        .animate-spin-cd,
        .animate-spin-reel,
        .animate-lcd,
        .animate-bg-enter { animation: none; }
      }

      /* Texture/Noise overlay effect */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        z-index: 50;
      }

      .font-hand { font-family: "Permanent Marker", cursive; }
      .font-mono { font-family: "IBM Plex Mono", monospace; }
      .font-display { font-family: "DM Sans", sans-serif; }

      .cassette-shadow {
        filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45)) drop-shadow(0 6px 12px rgba(0,0,0,0.3));
      }

      @keyframes cassette-eject {
        0% { transform: rotate(90deg) scale(0.48) translateY(0); opacity: 1; }
        100% { transform: rotate(90deg) scale(0.48) translateY(-140px); opacity: 0; }
      }
      @keyframes cassette-insert {
        0% { transform: rotate(90deg) scale(0.48) translateY(-120px); opacity: 0; }
        70% { transform: rotate(90deg) scale(0.48) translateY(8px); opacity: 1; }
        100% { transform: rotate(90deg) scale(0.48) translateY(0); opacity: 1; }
      }
      .animate-cassette-eject { animation: cassette-eject 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      .animate-cassette-insert { animation: cassette-insert 0.65s cubic-bezier(0.34, 1.2, 0.64, 1) forwards; }

      .animate-lcd { animation: lcd-flicker 4s ease-in-out infinite; }

      @keyframes analog-glitch {
        0%, 100% { transform: translateX(0); filter: none; }
        20% { transform: translateX(-2px); filter: hue-rotate(2deg); }
        40% { transform: translateX(1px); }
        60% { transform: translateX(-1px); filter: saturate(1.1); }
        80% { transform: translateX(2px); }
      }
      @keyframes analog-wobble {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-1px) skewX(0.3deg); }
        75% { transform: translateY(1px) skewX(-0.3deg); }
      }
      @keyframes tape-wobble {
        0%, 100% { transform: rotate(90deg) scale(0.48) translateY(0) rotateZ(0deg); }
        50% { transform: rotate(90deg) scale(0.48) translateY(0) rotateZ(0.15deg); }
      }
      .analog-glitch {
        background: linear-gradient(90deg, rgba(255,0,0,0.02) 0%, transparent 33%, rgba(0,255,255,0.02) 66%, transparent 100%);
        mix-blend-mode: screen;
        animation: analog-glitch 0.2s steps(2) forwards;
      }
      .analog-wobble {
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 3px);
        animation: analog-wobble 0.5s ease-in-out;
      }
      .tape-wobble-play { animation: tape-wobble 3s ease-in-out infinite; }

      .btn-press:active { transform: translateY(2px); }
      .btn-press:hover { filter: brightness(1.08); }

      .wood-texture {
        background-color: #3a2820;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          url("https://www.transparenttextures.com/patterns/wood-pattern.png");
        background-size: 100px 100px, 100px 100px, auto;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <div class="noise-overlay"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
